<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="14" r="14" fill="url(#g1)"/>
          <path d="M14 7C14 7 10 11 10 14C10 17 14 21 14 21C14 21 18 17 18 14C18 11 14 7 14 7Z" fill="white" opacity="0.9"/>
          <path d="M7 14C7 14 11 10 14 10C17 10 21 14 21 14C21 14 17 18 14 18C11 18 7 14 7 14Z" fill="white" opacity="0.5"/>
          <defs>
            <linearGradient id="g1" x1="0" y1="0" x2="28" y2="28">
              <stop offset="0%" stop-color="#4285f4"/>
              <stop offset="50%" stop-color="#9b59b6"/>
              <stop offset="100%" stop-color="#e74c3c"/>
            </linearGradient>
          </defs>
        </svg>
        <span>Gemini</span>
      </div>
      <button class="toggle-btn" id="toggleSidebar" title="Sidebar yopish">&#9776;</button>
    </div>
    <button class="new-chat-btn" id="newChatBtn">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a.5.5 0 0 1 .5.5v6h6a.5.5 0 0 1 0 1h-6v6a.5.5 0 0 1-1 0v-6h-6a.5.5 0 0 1 0-1h6v-6A.5.5 0 0 1 8 1z"/></svg>
      Yangi chat
    </button>
    <div class="chat-history" id="chatHistory"></div>
    <div class="sidebar-footer">
      <button class="settings-btn" id="openSettings">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z"/><path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.892 3.433-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.892-1.64-.901-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52l-.094-.319zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.474l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115l.094-.319z"/></svg>
        Sozlamalar
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="toggle-btn mobile-toggle" id="mobileToggle">&#9776;</button>
      <span class="model-name">Gemini 2.0 Flash</span>
    </div>
ox="0 0 56 56" fill="none">
            <circle cx="28" cy="28" r="28" fill="url(#wg)"/>
            <path d="M28 14C28 14 20 22 20 28C20 34 28 42 28 42C28 42 36 34 36 28C36 22 28 14 28 14Z" fill="white" opacity="0.9"/>
            <path d="M14 28C14 28 22 20 28 20C34 20 42 28 42 28C42 28 34 36 28 36C22 36 14 28 14 28Z" fill="white" opacity="0.5"/>
            <defs>
              <linearGradient id="wg" x1="0" y1="0" x2="56" y2="56">
                <stop offset="0%" stop-color="#4285f4"/>
                <stop offset="50%" stop-color="#9b59b6"/>
                <stop offset="100%" stop-color="#e74c3c"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1>Salom, men Gemini</h1>
        <p>Bugun sizga qanday yordam bera olaman?</p>
        <div class="suggestions">
          <button class="suggestion-chip" onclick="useSuggestion(this)">Dasturlash haqida tushuntir</button>
          <button class="suggestion-chip" onclick="useSuggestion(this)">Ingliz tilini o'rganishga yordam ber</button>
          <button class="suggestion-chip" onclick="useSuggestion(this)">Qisqa hikoya yoz</button>
          <button class="suggestion-chip" onclick="useSuggestion(this)">Matematika masalasini yech</button>
        </div>
      </div>
      <div class="messages" id="messages"></div>
    </div>

    <div class="input-area">
      <div class="input-box">
        <textarea id="userInput" placeholder="Xabar yozing..." rows="1"></textarea>
        <div class="input-actions">
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M10.894 2.553a1 1 0 0 0-1.788 0l-7 14a1 1 0 0 0 1.169 1.409l5-1.429A1 1 0 0 0 9 15.571V11a1 1 0 0 1 2 0v4.571a1 1 0 0 0 .725.962l5 1.428a1 1 0 0 0 1.17-1.408l-7-14z"/></svg>
          </button>
        </div>
      </div>
      <p class="disclaimer">Gemini xato qilishi mumkin. Muhim ma'lumotlarni tekshiring.</p>
    </div>
  </main>
</div>

<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <div class="modal-header">
      <h2>Sozlamalar</h2>
      <button class="close-btn" id="closeSettings">&times;</button>
    </div>
    <div class="modal-body">
      <label>Gemini API Kaliti</label>
      <input type="password" id="apiKeyInput" placeholder="AIza...">
      <small>API kalitini <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a>dan oling</small>
      <label style="margin-top:16px;">Model</label>
      <select id="modelSelect">
        <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
        <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
        <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
      </select>
    </div>
    <div class="modal-footer">
      <button class="save-btn" id="saveSettings">Saqlash</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
